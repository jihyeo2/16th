{{- $keep := slice "linkedin" "github" "discord" "x" }}

<ul class="share-buttons">
    {{- range site.Params.socialIcons }}
    {{- if in $keep .name }}
    <li>
        <a href="{{ trim .url " " | safeURL }}" target="_blank" rel="noopener noreferrer me"
            aria-label="{{ (.title | default .name) | title }}">
            {{ partial "svg.html" . }}
        </a>
    </li>
    {{- end }}
    {{- end }}
</ul>
